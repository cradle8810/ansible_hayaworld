- name: Play for llama servers on AWS
  gather_facts: true
  remote_user: ansible
  become: true
  hosts: all

  vars_files:
    - host_vars/networks.yml

  handlers:
    - name: Restart handler tasks
      ansible.builtin.import_tasks:
        file: handlers/main.yml

  tasks:
    - name: Common Settings
      ansible.builtin.import_role:
        name: common_aws
      vars:
        common_install_users: false

    - name: Install Local AI Tools
      ansible.builtin.import_role:
        name: ex-llama

    - name: "Setup Tailscale Endpoint"
      ansible.builtin.import_role:
        name: tailscale_install
      vars:
        tailscale_install_tags:
          - ai
        tailscale_install_args: "--accept-dns=false --advertise-exit-node"
        tailscale_shortname: "ex-llama"
      tags:
        - tailscale
