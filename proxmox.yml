---
- name: Play for Proxmox Nodes
  hosts: proxmox
  remote_user: root
  gather_facts: true

  vars_files:
    - host_vars/networks.yml

  handlers:
    - name: Restart handler tasks
      ansible.builtin.import_tasks:
        file: handlers/main.yml

  tasks:
    - name: "Common / Set Hostinfo"
      ansible.builtin.set_fact:
        common_hostinfo: "{{ network | selectattr('ipv4', 'eq', mgmt_ipv4) | first }}"
      vars:
        mgmt_ipv4: "{{ ansible_facts['all_ipv4_addresses'] | select('match', '192.168.88.') | first }}"
      tags:
        - always

    - name: Proxmox Configurations
      ansible.builtin.import_role:
        name: proxmox
      vars:
        proxmox_macaddr: "{{ common_hostinfo.macaddress }}"
      tags:
        - proxmox

    - name: "Configure Rsyslog"
      ansible.builtin.import_role:
        name: rsyslog_client
      vars:
        rsyslog_client_config_owner: root
        rsyslog_client_config_group: root
        rsyslog_client_additional_actions: "{{ rsyslog.rsyslog_client_additional_actions }}"
        rsyslog_client_journald_persistent: false
      tags:
        - rsyslog

    - name: "APC UPS Settings"
      ansible.builtin.import_role:
        name: apcupsd
      vars:
        apcupsd_role: slave
        apcupsd_timeout: 100
        apcupsd_proxmox: true
      tags:
        - apc
        - ups

    - name: Scrutiny collector setting
      ansible.builtin.import_role:
        name: scrutiny_collector
      vars:
        scrutiny_collector_server_id: "{{ common_hostinfo.shortname }}"
        scrutiny_collector_cron: true
        scrutiny_collector_device:
          devices:
            - device: '/dev/sda'
              type: 'sat'
            - device: /dev/sdb
              type: 'sat'
      tags:
        - scrutiny

    - name: Zabbix Agent Config
      ansible.builtin.import_tasks:
        file: tasks/zabbix-agent2.yml
      tags:
        - zabbix

    - name: "Setup Tailscale Endpoint"
      ansible.builtin.include_role:
        name: tailscale_install
        apply:
          tags:
            - tailscale
      vars:
        tailscale_install_tags:
          - proxmox
        tailscale_install_serve: true
        tailscale_install_funnel: false
        tailscale_install_serve_https_port: 443
        tailscale_install_serve_set_path: "/"
        tailscale_install_serve_url: "https+insecure://localhost:8006"
        tailscale_install_args: "--accept-dns=true"
        tailscale_ufw_enable: false
        tailscale_install_serve_to_insecure: true
      tags:
        - tailscale
