---
firewall:
  policy: deny
  allow_rules:
    ipv4:
      - name: "SSH from service line"
        proto: "tcp"
        src: "192.168.88.0/24"
        port: '22'
      - name: "Zabbix from Zabbix-server"
        proto: "tcp"
        src: "192.168.88.106/24"
        port: "10050"
      - name: "NocoDB"
        proto: "tcp"
        src: "192.168.88.0/24"
        port: "8080"
      - name: "NocoDB via Tailscale"
        proto: "tcp"
        src: "100.64.0.0/10"
        port: "8081"
    ipv6:
      - name: "DHCPv6 Client from service line"
        proto: "udp"
        src: "::"
        port: "546"

docker_config:
  ipv6: true
  ip6tables: true
  userland-proxy: false
  dns:
    - 100.100.100.100
  fixed-cidr-v6: "fd40:8a43:6f4d::1/64"
  bip: "172.18.12.1/24"
