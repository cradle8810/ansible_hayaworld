firewall:
  policy: deny
  allow_rules:
    ipv4:
      - name: "SSH from service line"
        proto: "tcp"
        src: "192.168.88.0/24"
        port: '22'
      - name: "HTTP server"
        proto: "tcp"
        src: "0.0.0.0/0"
        port: "8080"
      - name: "Firecrawl server"
        proto: "tcp"
        src: "0.0.0.0/0"
        port: "3002"
    ipv6:
      - name: "DHCPv6 Client from service line"
        proto: "udp"
        src: "::"
        port: "546"
      - name: "HTTP server"
        proto: "tcp"
        src: "::"
        port: "8080"
      - name: "Firecrawl server"
        proto: "tcp"
        src: "::"
        port: "3002"

docker_drive_is_opt_docker: true
docker_btrfs: false
docker_drive_fstype: ext4
docker_drive_opts: "defaults,noatime,async"
docker_drive_uuid: "32bf2d7a-b259-4c7d-bc0d-a4bb8d7d732c"
docker_users:
  - hayato
  - ansible
docker_config:
  ipv6: true
  ip6tables: true
  userland-proxy: false
  dns:
    - 192.168.88.100
    - 192.168.88.200
  fixed-cidr-v6: "fd25:5951:9b0d:1::/64"
  bip: "172.18.5.1/24"

borg_device: "/mnt/backup/Service_Backups/searxng"
borg_sources:
  - src: "/root/searxng/config/"
    dest: config
  - src: data
    dest: data
